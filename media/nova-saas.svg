<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Nova SaaS landing page — illustrative sample</title><desc id="desc">An original illustrative website preview. Replace this sample with your actual site capture.</desc><defs><linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ad7aff"/><stop offset="1" stop-color="#5265ff"/></linearGradient><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c6dedc"/><stop offset="1" stop-color="#f0e9d7"/></linearGradient><linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#202343"/><stop offset="1" stop-color="#12131d"/></linearGradient><linearGradient id="lime" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9f974"/><stop offset="1" stop-color="#67d4a4"/></linearGradient></defs><rect x="0" y="0" width="960" height="600" rx="0" fill="#0d0b19" /><g font-family="Arial, Helvetica, sans-serif"><circle cx="780" cy="270" r="225" fill="#5b33a2" opacity=".16"/><text x="48" y="56" fill="#fff" font-size="23" font-weight="800" >✦ nova</text><text x="912" y="54" fill="#fff" font-size="13" font-weight="500" text-anchor="end">Product     Stories     Contact</text><line x1="48" y1="83" x2="912" y2="83" stroke="#28233f" stroke-width="1" /><rect x="48" y="140" width="192" height="38" rx="19" fill="#251b41" /><text x="144" y="165" fill="#c4a6ff" font-size="14" font-weight="600" text-anchor="middle">THE NEXT WAY TO WORK</text><text x="48" y="244" fill="#f3efff" font-size="55" font-weight="700" >Less busywork.</text><text x="48" y="307" fill="#b59aff" font-size="55" font-weight="700" >More big ideas.</text><text x="48" y="350" fill="#a5a0b6" font-size="17" font-weight="400" >One thoughtful workspace for everything</text><text x="48" y="377" fill="#a5a0b6" font-size="17" font-weight="400" >your team is ready to build.</text><rect x="48" y="406" width="154" height="38" rx="19" fill="url(#purple)" /><text x="125" y="431" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">Start your workspace</text><text x="223" y="430" fill="#e0d8f1" font-size="14" font-weight="400" >See how it works →</text><rect x="532" y="157" width="388" height="308" rx="16" fill="#161322" stroke="#4a3b69"/><rect x="532" y="157" width="388" height="35" rx="16" fill="#211b33" /><rect x="532" y="177" width="388" height="15" rx="0" fill="#211b33" /><circle cx="550" cy="175" r="4" fill="#ff9688" /><circle cx="564" cy="175" r="4" fill="#f4d06f" /><circle cx="578" cy="175" r="4" fill="#7ed4a9" /><text x="555" y="228" fill="#f2ecff" font-size="17" font-weight="700" >Overview</text><text x="555" y="252" fill="#a49ab8" font-size="11" font-weight="400" >Make this week a great one.</text><rect x="555" y="271" width="162" height="69" rx="8" fill="#29203f" /><rect x="732" y="271" width="162" height="69" rx="8" fill="#202a35" /><text x="568" y="292" fill="#b2a5ce" font-size="9" font-weight="600" >PROJECTS IN MOTION</text><text x="568" y="325" fill="#eee6ff" font-size="27" font-weight="700" >24</text><text x="745" y="292" fill="#a1beb9" font-size="9" font-weight="600" >TEAM MOMENTUM</text><text x="745" y="325" fill="#8fe0c1" font-size="27" font-weight="700" >+38%</text><rect x="555" y="355" width="339" height="87" rx="8" fill="#1d182b" /><text x="568" y="376" fill="#c5bbd7" font-size="11" font-weight="600" >Your work, moving forward</text><path d="M568 425 L600 411 L630 414 L662 391 L693 405 L724 387 L756 394 L785 379 L816 384 L850 366 L883 373" fill="none" stroke="#a889ff" stroke-width="3"/><line x1="48" y1="496" x2="912" y2="496" stroke="#28233f" stroke-width="1" /><text x="48" y="532" fill="#898196" font-size="14" font-weight="400" >A home for your next breakthrough.</text><text x="912" y="532" fill="#898196" font-size="13" font-weight="400" text-anchor="end">Built for thoughtful teams</text><rect x="792" y="558" width="142" height="26" rx="13" fill="#10121d" opacity=".9"/><text x="863" y=