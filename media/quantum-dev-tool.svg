<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Quantum developer tool — illustrative sample</title><desc id="desc">An original illustrative website preview. Replace this sample with your actual site capture.</desc><defs><linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ad7aff"/><stop offset="1" stop-color="#5265ff"/></linearGradient><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c6dedc"/><stop offset="1" stop-color="#f0e9d7"/></linearGradient><linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#202343"/><stop offset="1" stop-color="#12131d"/></linearGradient><linearGradient id="lime" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9f974"/><stop offset="1" stop-color="#67d4a4"/></linearGradient></defs><rect x="0" y="0" width="960" height="600" rx="0" fill="#09131b" /><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="56" fill="#d4f9ed" font-size="23" font-weight="800" >⌘ quantum</text><text x="912" y="54" fill="#d4f9ed" font-size="13" font-weight="500" text-anchor="end">Docs     Changelog     GitHub     Start building ↗</text><line x1="48" y1="85" x2="912" y2="85" stroke="#243d40" stroke-width="1" /><rect x="48" y="132" width="199" height="38" rx="19" fill="#17302d" /><text x="147.5" y="157" fill="#83e4ba" font-size="14" font-weight="600" text-anchor="middle">LESS FRICTION. MORE FLOW.</text><text x="48" y="237" fill="#e8f9f2" font-size="57" font-weight="700" >Build at the</text><text x="48" y="303" fill="#87ddba" font-size="57" font-weight="700" >speed of thought.</text><text x="48" y="348" fill="#819e98" font-size="16" font-weight="400" >The developer toolkit that gets out of your way.</text><rect x="48" y="389" width="159" height="38" rx="19" fill="#88e3bb" /><text x="127.5" y="414" fill="#10241d" font-size="14" font-weight="600" text-anchor="middle">Read the docs</text><text x="227" y="414" fill="#b1d3c4" font-size="14" font-weight="400" >Explore the API →</text><rect x="558" y="151" width="354" height="295" rx="12" fill="#101f27" stroke="#36544b"/><rect x="558" y="151" width="354" height="37" rx="12" fill="#192b31" /><rect x="558" y="172" width="354" height="16" rx="0" fill="#192b31" /><circle cx="578" cy="170" r="4" fill="#e8998a" /><circle cx="592" cy="170" r="4" fill="#d9be70" /><circle cx="606" cy="170" r="4" fill="#7dc9a6" /><text x="643" y="175" fill="#85a797" font-size="11" font-weight="400" >quickstart.js</text><g font-family="Consolas, monospace"><text x="579" y="223" fill="#607e76" font-size="12" font-weight="400" >// Your next idea starts here</text><text x="579" y="252" fill="#a9ddb8" font-size="12" font-weight="400" >import { quantum } from &quot;sdk&quot;;</text><text x="579" y="281" fill="#bed2d8" font-size="12" font-weight="400" >const project = await quantum</text><text x="579" y="310" fill="#a7d6c7" font-size="11" font-weight="400" >  .create({ name: &quot;next-big-thing&quot; })</text><text x="579" y="339" fill="#bed2d8" font-size="12" font-weight="400" >  .deploy();</text><text x="579" y="394" fill="#82d9ab" font-size="12" font-weight="400" >✓ Ready. Ship something great.</text></g><line x1="48" y1="491" x2="912" y2="491" stroke="#243d40" stroke-width="1" /><text x="48" y="532" fill="#72998a" font-size="14" font-weight="400" >Made for builders, by builders.</text><text x="912" y="532" fill="#72998a" font-size="11" font-weight="700" text-anchor="end">SIMPLE TO START. ROOM TO GROW.</text><rect x="792" y="558" width="142" height="26" rx="13" fill="#10121d" opacity=".9"/><text x="863" y="575" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Sample design</text></g></svg>
