<svg xmlns="http://www.w3.org/2000/svg" width="640" height="800" viewBox="0 0 640 800" role="img" aria-labelledby="title desc">
  <title id="title">Sample sponsor advertisement</title>
  <desc id="desc">Your brand. Their next idea. A sample advertising image for the product grid.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#181331"/><stop offset="1" stop-color="#080d1f"/></linearGradient>
    <linearGradient id="ribbon" x2="1" y2="1"><stop stop-color="#cb9cff"/><stop offset=".5" stop-color="#8a65ff"/><stop offset="1" stop-color="#4f8cff"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#7c5cff" stop-opacity=".45"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="640" height="800" fill="url(#background)"/>
  <circle cx="320" cy="245" r="275" fill="url(#glow)"/>
  <g fill="none" stroke="url(#ribbon)" stroke-width="36"><ellipse cx="320" cy="255" rx="135" ry="77" transform="rotate(-32 320 255)"/><ellipse cx="320" cy="255" rx="135" ry="77" transform="rotate(32 320 255)"/></g>
  <circle cx="320" cy="255" r="24" fill="#e4d7ff"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="320" y="90" font-size="14" font-weight="700" letter-spacing="4" fill="#b5a4ed">SPONSOR SPOTLIGHT</text>
    <text x="320" y="455" font-size="53" font-weight="700" fill="#f5f1ff">Your brand.</text>
    <text x="320" y="521" font-size="47" font-weight="700" fill="#b69cff">Their next idea.</text>
    <text x="320" y="585" font-size="19" fill="#a79ebf">Be seen by people ready to build.</text>
    <text x="320" y="699" font-size="17" fill="#d5c9ff">An image. A link. A little possibility.</text>
    <text x="320" y="745" font-size="13" letter-spacing="1" fill="#817699">SAMPLE ADVERTISEMENT</text>
  </g>
</svg>
