<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Brew coffee roastery — illustrative sample</title><desc id="desc">An original illustrative website preview. Replace this sample with your actual site capture.</desc><defs><linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ad7aff"/><stop offset="1" stop-color="#5265ff"/></linearGradient><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c6dedc"/><stop offset="1" stop-color="#f0e9d7"/></linearGradient><linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#202343"/><stop offset="1" stop-color="#12131d"/></linearGradient><linearGradient id="lime" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9f974"/><stop offset="1" stop-color="#67d4a4"/></linearGradient></defs><rect x="0" y="0" width="960" height="600" rx="0" fill="#eee4d0" /><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="56" fill="#44351f" font-size="23" font-weight="800" >brew.</text><text x="912" y="54" fill="#44351f" font-size="13" font-weight="500" text-anchor="end">Our coffee     Our story     Visit the roastery</text><line x1="48" y1="86" x2="912" y2="86" stroke="#cabc9d" stroke-width="1" /><text x="48" y="143" fill="#766a4c" font-size="11" font-weight="700" >SLOW MORNINGS. GOOD COFFEE.</text><text x="48" y="239" fill="#44351f" font-size="58" font-weight="700" >A little ritual.</text><text x="48" y="306" fill="#806044" font-size="58" font-weight="700" >A better day.</text><text x="49" y="348" fill="#807157" font-size="16" font-weight="400" >Thoughtfully sourced. Patiently roasted.</text><text x="49" y="375" fill="#807157" font-size="16" font-weight="400" >Made to bring you back to the moment.</text><rect x="48" y="410" width="158" height="38" rx="19" fill="#65492e" /><text x="127" y="435" fill="#fff5df" font-size="14" font-weight="600" text-anchor="middle">Find your roast</text><circle cx="729" cy="279" r="173" fill="#d8c39b" /><rect x="608" y="169" width="155" height="240" rx="12" fill="#8c6543" transform="rotate(-7 686 289)"/><rect x="624" y="217" width="124" height="110" rx="2" fill="#eee3c8" transform="rotate(-7 686 272)"/><text x="688" y="254" fill="#5f452c" font-size="27" font-weight="700" text-anchor="middle" transform="rotate(-7 686 272)">BREW</text><text x="688" y="280" fill="#5f452c" font-size="11" font-weight="600" text-anchor="middle" transform="rotate(-7 686 272)">DAILY BLEND</text><text x="688" y="303" fill="#826a48" font-size="8" font-weight="400" text-anchor="middle" transform="rotate(-7 686 272)">Warm • Balanced • Yours</text><circle cx="804" cy="402" r="47" fill="#f7efd9" /><circle cx="804" cy="402" r="31" fill="#563a25" /><circle cx="814" cy="393" r="11" fill="#a3784e" opacity=".55"/><path d="M844 383 Q879 372 879 402 Q879 428 847 421" fill="none" stroke="#f7efd9" stroke-width="13"/><line x1="48" y1="496" x2="912" y2="496" stroke="#cabc9d" stroke-width="1" /><text x="48" y="534" fill="#897456" font-size="15" font-weight="400" >Good things take a little time.</text><text x="912" y="534" fill="#897456" font-size="11" font-weight="700" text-anchor="end">FRESHLY ROASTED / ALWAYS</text><rect x="792" y="558" width="142" height="26" rx="13" fill="#10121d" opacity=".9"/><text x="863" y="575" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Sample design</text></g></svg>
